<div class="admin-login-backdrop" (click)="closePanel()"></div>
<div class="admin-login-panel">
  <h2>Admin Login</h2>

  <!-- Success or error message -->
  @if (message) {
    <p [style.color]="messageColor">{{ message }}</p>
  }

  <form (ngSubmit)="login()">
    <input
      type="text"
      [(ngModel)]="username"
      name="username"
      placeholder="Username"
      required
      />
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Password"
        required
        />
        <button type="submit">Login</button>
      </form>
    </div>
